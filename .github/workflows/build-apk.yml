name: Build Paymint APK
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
                
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore Android pilot source
        env:
          ANDROID_SOURCE_ZIP: 
        run: |
          python3 - <<'PYTHON'
          import os, base64, io, zipfile
          archive = zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['ANDROID_SOURCE_ZIP'])))
          archive.extractall('android')
          PYTHON
      - name: Compile test APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Paymint-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: erro
